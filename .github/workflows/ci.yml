# 衔星 | Starbit — 持续集成
# 触发：push / PR 到主分支（兼容 main 与 master）
# 前置：工程脚手架（package.json）落地后生效，脚本约定见下方注释。
#       主分支推送会直接触发，建议脚手架就绪后再推送 GitHub 启用。
name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitee/**'
      - '.github/**'
      - '.design_library/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitee/**'
      - '.github/**'
      - '.design_library/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        # package.json scripts 约定：pnpm typecheck -> tsc --noEmit
        run: pnpm typecheck

      - name: Lint
        # scripts 约定：pnpm lint -> eslint 全量检查
        run: pnpm lint

      - name: Unit tests
        # scripts 约定：pnpm test:unit -> vitest run（core 层纯 TS，无需 Electron）
        run: pnpm test:unit

  e2e:
    name: Electron E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native modules for Electron
        # node-pty / better-sqlite3 等原生模块需按 Electron ABI 重编译
        run: pnpm exec electron-builder install-app-deps

      - name: Install Playwright deps & Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0

      - name: Electron E2E tests
        # scripts 约定：pnpm test:e2e -> playwright test（_electron.launch 关键路径）
        # Electron GUI 在无头环境需 xvfb 包裹
        run: xvfb-run --auto-servernum pnpm test:e2e
